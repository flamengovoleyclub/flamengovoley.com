<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F12" />
      <stop offset="60%" stop-color="#161820" />
      <stop offset="100%" stop-color="#090A0D" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6584" />
      <stop offset="50%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#D81B4E" />
    </linearGradient>
    <radialGradient id="pinkGlow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255, 75, 114, 0.28)" />
      <stop offset="100%" stop-color="rgba(255, 75, 114, 0)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <circle cx="950" cy="200" r="350" fill="url(#pinkGlow)" />
  <circle cx="150" cy="550" r="250" fill="url(#pinkGlow)" opacity="0.4" />

  <!-- Grid lines aesthetic -->
  <g stroke="rgba(250, 248, 245, 0.04)" stroke-width="1.5">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
  </g>

  <!-- Brand Badge -->
  <rect x="80" y="80" width="380" height="42" rx="21" fill="rgba(255, 75, 114, 0.15)" stroke="#FF4B72" stroke-width="1.5" />
  <text x="105" y="107" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="16" fill="#FF708F" letter-spacing="1.5">
    🏐 CLUB DE VOLEIBOL EN BOGOTÁ
  </text>

  <!-- Main Headline -->
  <text x="80" y="210" font-family="'Outfit', sans-serif" font-weight="900" font-size="64" fill="#FAF8F5" letter-spacing="-1">
    FLAMENGO VOLEIBOL
  </text>
  
  <text x="80" y="280" font-family="'Outfit', sans-serif" font-weight="700" font-size="44" fill="#FF4B72">
    Encuentra tu lugar en la cancha.
  </text>

  <!-- Subtitle -->
  <text x="80" y="350" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="22" fill="#D2D6DF">
    Entrenamientos formativos, iniciación y competencia para todas las edades.
  </text>
  <text x="80" y="385" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="22" fill="#D2D6DF">
    Aprende, compite y crece con la mejor comunidad deportiva en Bogotá.
  </text>

  <!-- Key Badges -->
  <g transform="translate(80, 440)">
    <rect width="280" height="60" rx="14" fill="#1C1F2A" stroke="rgba(250, 248, 245, 0.1)" stroke-width="1" />
    <text x="25" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" fill="#FAF8F5">🔥 Prueba Gratuita</text>
  </g>
  <g transform="translate(380, 440)">
    <rect width="280" height="60" rx="14" fill="#1C1F2A" stroke="rgba(250, 248, 245, 0.1)" stroke-width="1" />
    <text x="25" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" fill="#FAF8F5">🏆 Todos los Niveles</text>
  </g>
  <g transform="translate(680, 440)">
    <rect width="280" height="60" rx="14" fill="url(#pinkGrad)" />
    <text x="35" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#FAF8F5">👉 QUIERO ENTRENAR</text>
  </g>

  <!-- Decorative Volleyball graphic on the right -->
  <g transform="translate(980, 220)">
    <circle cx="0" cy="0" r="140" fill="#FAF8F5" stroke="#0E0F12" stroke-width="10" />
    <path d="M -90 -90 C -30 -30 30 -30 90 -90" fill="none" stroke="#FF3366" stroke-width="10" />
    <path d="M 0 -140 L 0 140" fill="none" stroke="#0E0F12" stroke-width="10" />
    <path d="M -120 60 C -60 30 30 60 110 110" fill="none" stroke="#FF3366" stroke-width="10" />
  </g>
</svg>
